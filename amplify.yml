version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd frontend-react
        - npm install
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: frontend-react/dist
    files:
      - '**/*'
  cache:
    paths:
      - frontend-react/node_modules/**/*
customRules:
  - source: '</^[^.]+$|\.(?!(css|gif|ico|jpg|js|png|txt|svg|woff|woff2|ttf|map|json|webp)$)([^.]+$)/>'
    status: '200'
    target: '/index.html'
